version: 2
project_name: vitalbridge

before:
  hooks:
    - go mod tidy

builds:
  - id: vitalbridge
    main: .
    binary: vitalbridge
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: vitalbridge
    ids:
      - vitalbridge
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  disable: true

release:
  github:
    owner: korosuke613
    name: vitalbridge
  draft: false
  prerelease: auto
